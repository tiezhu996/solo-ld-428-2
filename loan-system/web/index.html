<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>艺术作品借展与运输交接系统</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">借</div>
        <div>
          <div class="brand-title">借展运输交接</div>
          <div class="brand-sub">Loan &amp; Transit Desk</div>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">馆藏登记 · 运输交接 · 状态核对</div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div id="page-title" class="page-title"></div>
        <div class="topbar-right">
          <span id="today-badge" class="today-badge"></span>
          <button id="nav-reminders" class="btn btn-ghost" data-nav="/reminders">
            🔔 提醒 <span id="reminder-dot" class="dot hidden"></span>
          </button>
        </div>
      </header>
      <div id="view" class="view"></div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/pages/dashboard.js"></script>
  <script src="/js/pages/artworks.js"></script>
  <script src="/js/pages/institutions.js"></script>
  <script src="/js/pages/loans.js"></script>
  <script src="/js/pages/loan-detail.js"></script>
  <script src="/js/pages/reminders.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
